# ENG-04 data contract. One file per contract: ENG-04-data-contracts/<dp-or-src>-<entity>.yaml
# Loosely follows the Open Data Contract Standard (ODCS) shape. Adjust to the team's tooling.
contract_id: DC-001
version: 1.0.0
status: draft            # draft | active | deprecated
data_product: DP-001
dataset: gold.fct_orders
owner:
  team: null
  contact: null
consumers:
  - name: null
    use: null
description: null
grain: one row per order line
primary_key: [order_line_id]
schema:
  - name: order_line_id
    type: string
    required: true
    unique: true
    description: null
    pii: false
  - name: order_date
    type: date
    required: true
    description: null
quality:
  - rule: not_null
    columns: [order_line_id, order_date]
    severity: error
  - rule: row_count_vs_source
    tolerance_pct: 0.5
    severity: error
  - rule: freshness
    max_age_hours: 26
    severity: error
sla:
  freshness_nfr: NFR-001
  available_by: "06:00 America/Chicago, business days"
  support_hours: null
versioning:
  breaking_change_policy: "New major version, 30-day overlap, consumers notified"
  deprecation_notice_days: 30
security:
  classification: confidential
  rls: null
  masked_columns: []
